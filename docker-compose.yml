services:

  # ── FastAPI Backend ──────────────────────────────────────
  api:
    build: ./backend
    environment:
      DATABASE_URL:          ${DATABASE_URL}
      OPENAI_API_KEY:        ${OPENAI_API_KEY}
      GEMINI_API_KEY:        ${GEMINI_API_KEY}
      OPENAI_MODEL:          ${OPENAI_MODEL:-gpt-4.1}
      OPENAI_ANALYZER_MODEL: ${OPENAI_ANALYZER_MODEL:-gpt-4.1-mini}
      GEMINI_MODEL:          ${GEMINI_MODEL:-gemini-2.0-flash}
      DEBUG:                 ${DEBUG:-false}
      # Auth
      SECRET_KEY:            ${SECRET_KEY:-cambiar-en-produccion}
      AUTH_USERNAME:         ${AUTH_USERNAME:-sembi2026}
      AUTH_PASSWORD:         ${AUTH_PASSWORD:-test1234}
    networks:
      - dokploy-network
    restart: unless-stopped

  # ── React Frontend (nginx) ───────────────────────────────
  web:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      # Hostname interno del backend. En docker-compose local = "api" (nombre del servicio).
      # En EasyPanel servicios separados: poné el nombre interno del servicio backend.
      API_UPSTREAM: ${API_UPSTREAM:-api:8000}
    depends_on:
      - api
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
