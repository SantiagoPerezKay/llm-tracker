services:

  # ── FastAPI Backend ──────────────────────────────────────
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # DATABASE_URL se lee del .env del servidor (apunta a tu Postgres de EasyPanel)
      DATABASE_URL:       ${DATABASE_URL}
      OPENAI_API_KEY:     ${OPENAI_API_KEY}
      GEMINI_API_KEY:     ${GEMINI_API_KEY}
      OPENAI_MODEL:       ${OPENAI_MODEL:-gpt-4.1}
      OPENAI_ANALYZER_MODEL: ${OPENAI_ANALYZER_MODEL:-gpt-4.1-mini}
      GEMINI_MODEL:       ${GEMINI_MODEL:-gemini-2.0-flash}
      DEBUG:              ${DEBUG:-false}
    restart: unless-stopped

  # ── React Frontend (nginx) ───────────────────────────────
  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
